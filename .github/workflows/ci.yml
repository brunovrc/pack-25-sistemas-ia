name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Catálogo, estrutura e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/check-no-secrets.mjs
      - name: Estrutura gerada está em dia
        run: |
          node scripts/generate-systems.mjs
          git diff --exit-code -- sistemas || { echo "Estrutura divergente: rode scripts/generate-systems.mjs e commite"; exit 1; }

  core-web:
    name: Core web (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (variáveis fictícias, só para compilar)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:58321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-key-not-a-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3123
        run: pnpm build

  core-e2e:
    name: Core web (ponta a ponta com Supabase real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.120.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@12.6.0
      - name: Instalar Supabase CLI (versão fixa, checksum verificado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          gh release download "v${SUPABASE_CLI_VERSION}" -R supabase/cli -p checksums.txt -p "supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          grep " supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          echo "$RUNNER_TEMP/sb" >> "$GITHUB_PATH"
      - name: Subir Supabase local (aplica as migrações)
        working-directory: core
        run: |
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status -o json > "$RUNNER_TEMP/sb-status.json"
      - run: pnpm install --frozen-lockfile
        working-directory: core/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: core/web
      - name: Build e iniciar o app
        working-directory: core/web
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .API_URL "$RUNNER_TEMP/sb-status.json")"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/sb-status.json")"
          export NEXT_PUBLIC_APP_URL=http://localhost:3123
          pnpm build
          (PORT=3123 nohup pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://localhost:3123/login >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1
      - name: Testes ponta a ponta
        working-directory: core/web
        run: |
          export E2E_BASE_URL=http://localhost:3123
          export E2E_SUPABASE_URL="$(jq -r .API_URL "$RUNNER_TEMP/sb-status.json")"
          export E2E_SUPABASE_ANON_KEY="$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/sb-status.json")"
          export E2E_MAILPIT_URL="$(jq -r .MAILPIT_URL "$RUNNER_TEMP/sb-status.json")"
          pnpm test:e2e --grep-invert "capturas"

  core-db:
    name: Core de banco (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/test-core-db.mjs
